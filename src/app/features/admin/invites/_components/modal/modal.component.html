<app-modal #modal
           (onHide)="hideEvent()"
           [size]="'lg'">
  <modal-header>
    <h2>Convidar</h2>
  </modal-header>
  <modal-body>
    <app-form-invites #form (onSave)="saved()"></app-form-invites>
  </modal-body>
  <modal-footer>
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-light me-2" (click)="hide()">Cancelar</button>
      <button type="button" class="btn btn-primary" [disabled]="form.saving" (click)="form.submit()">
        <i class="fa fa-paper-plane"></i>&nbsp;Enviar convite
      </button>
    </div>
  </modal-footer>
</app-modal>

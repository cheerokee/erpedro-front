<section [formGroup]="form">
  <div class="row">
    <div class="col-md-6 form-group">
      <label>Nome</label>
      <input formControlName="name" class="form-control" />
    </div>
    <div class="col-md-6 form-group">
      <label>Email</label>
      <input formControlName="email" type="email" class="form-control" />
    </div>
  </div>
  <hr />
  <h6 class="m-b-10">Vínculos (Colaborador / Paroquiano representado)</h6>
  <app-form-representations-user
    [(data)]="representations"
    (dataChange)="formListChange($event)"
  ></app-form-representations-user>

</section>

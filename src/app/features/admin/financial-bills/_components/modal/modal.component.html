<app-modal #modal
           (onHide)="hideEvent()"
           [size]="'xl'">
  <modal-header>
    <h2>Fatura</h2>
  </modal-header>
  <modal-body>
    <app-form-financial-bills #form [id]="id" (onSave)="saved()"></app-form-financial-bills>
  </modal-body>
  <modal-footer>
    <div class="d-flex justify-content-between align-items-center w-100">
      <small class="text-muted">
        @if (!id) {
          Itens e parcelas desta aba são enviados junto com "Salvar". Depois de criada, pagamentos são geridos direto na aba Parcelas.
        }
      </small>
      <div>
        <button type="button" class="btn btn-light me-2" (click)="hide()">Fechar</button>
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="form.saving"
          (click)="form.submit()"
        >
          <i class="fa fa-save"></i>&nbsp;Salvar
        </button>
      </div>
    </div>
  </modal-footer>
</app-modal>

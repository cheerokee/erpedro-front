<app-modal #modal
           (onHide)="hideEvent()"
           [size]="'xl'">
  <modal-header>
    <h2>Cadastro de Paroquianos</h2>
  </modal-header>
  <modal-body>
    <app-form-parishioners #form [id]="id" (onSave)="saved()"></app-form-parishioners>
  </modal-body>
  <modal-footer>
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-light me-2" (click)="hide()">Cancelar</button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="form.saving"
        (click)="form.submit()"
      >
        <i class="fa fa-save"></i>&nbsp;Salvar
      </button>
    </div>
  </modal-footer>
</app-modal>
